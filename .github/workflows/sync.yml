name: Synchronize upstream plugins

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Optional source ID; leave empty to check all sources
        required: false
        type: string
      dry_run:
        description: Validate without publishing or committing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scientific-market-publication
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test
      - name: Synchronize and publish bundles
        id: synchronize
        continue-on-error: true
        env:
          SOURCE_ID: ${{ inputs.source }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [[ -n "$SOURCE_ID" ]]; then args+=(--source "$SOURCE_ID"); fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          else
            args+=(--publish-dsh)
          fi
          npm run sync -- "${args[@]}"
      - name: Validate complete indexes
        if: inputs.dry_run != true
        run: npm run validate
      - name: Commit verified generated files
        if: inputs.dry_run != true
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git add --force -- packages catalog dsh docs/CATALOG.md .agents/plugins/marketplace.json .claude-plugin/marketplace.json .cursor-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git -c user.name='scientific-market[bot]' -c user.email='scientific-market@users.noreply.github.com' -c commit.gpgsign=false commit -m 'chore: synchronize scientific plugins'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
      - name: Summary
        if: always()
        run: node scripts/ci-summary.mjs
      - name: Report source or publication failures
        if: steps.synchronize.outcome == 'failure'
        run: exit 1
