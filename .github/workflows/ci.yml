name: Validate marketplace

on:
  pull_request:
  push:
    branches-ignore:
      - dist-dsh

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  windows-checkout:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep Git for Windows long path support disabled
        run: git config --global core.longpaths false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install pinned official Codex CLI for the public marketplace test
        run: npm install --global --ignore-scripts @openai/codex@0.166.0-alpha.1
      - name: Add the public repository by name and install plugins without long path support
        shell: pwsh
        run: |
          $env:MARKET_CODEX_NODE_ENTRY = Join-Path (npm root -g) '@openai\codex\bin\codex.js'
          npm run verify:windows
