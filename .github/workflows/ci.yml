name: Validate marketplace

on:
  pull_request:
  push:
    branches-ignore:
      - dist-dsh

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  windows-checkout:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Enable Git for Windows long path support
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Clone into a deep Codex-style staging directory and verify resources
        run: npm run verify:windows
